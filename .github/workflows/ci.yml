name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-m2-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build CI image (Java 27 and Clojure CLI)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .github/ci
          load: true
          tags: harness-clj-ci:latest
          cache-from: type=gha,scope=harness-clj-ci
          cache-to: type=gha,scope=harness-clj-ci,mode=max

      - name: Test, compile and run in Docker
        run: |
          mkdir -p "${HOME}/.m2/repository"
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            --mount "type=bind,source=${HOME}/.m2/repository,target=/root/.m2/repository" \
            --workdir /workspace \
            harness-clj-ci \
            bash -euc '
              java --version
              clojure -Sdescribe
              clojure -M:test
              clojure -M:build
              clojure -M:run
            '
